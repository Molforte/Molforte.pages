name: Sync articles submodule

# 内容库（Molforte/molforte.Articles）更新后，自动把 submodule 指针移到最新并重建站点。
# 每 30 分钟检查一次；也可以在 Actions 页面手动 Run workflow。
# 注：用的是仓库自带的 GITHUB_TOKEN，不需要额外 PAT（只读内容库 + 写本仓库）。
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: 把内容库拉到最新
        run: |
          git submodule update --remote --merge articles
          if git diff --quiet -- articles; then
            echo "内容库没有新提交，跳过"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        id: sync
      - name: 提交指针（会顺带触发部署工作流）
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles
          git commit -m "chore(content): 自动同步 submodule 指针到 $(git -C articles rev-parse --short HEAD)"
          git push
